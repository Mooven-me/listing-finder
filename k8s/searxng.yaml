apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: listing-finder
  labels:
    app.kubernetes.io/name: listing-finder
    app.kubernetes.io/component: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: "listing-finder-internal-searxng-key-change-if-exposed"
      limiter: false
      image_proxy: false
      method: "GET"
    search:
      safe_search: 0
      autocomplete: ""
      formats:
        - html
        - json
    engines:
      - name: duckduckgo
        disabled: false
      - name: bing
        disabled: false
      - name: brave
        disabled: false
      - name: wikipedia
        disabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: listing-finder
  labels:
    app.kubernetes.io/name: listing-finder
    app.kubernetes.io/component: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: listing-finder
      app.kubernetes.io/component: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listing-finder
        app.kubernetes.io/component: searxng
    spec:
      containers:
        - name: searxng
          image: searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080/"
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
            - name: searxng-cache
              mountPath: /var/cache/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: searxng-settings
          configMap:
            name: searxng-config
        - name: searxng-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: listing-finder
  labels:
    app.kubernetes.io/name: listing-finder
    app.kubernetes.io/component: searxng
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: listing-finder
    app.kubernetes.io/component: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
