apiVersion: v1
kind: Secret
metadata:
  name: listing-finder-secret
  namespace: listing-finder
type: Opaque
stringData:
  # Copy this file to k8s/secret.local.yaml (git-ignored), fill in your real secrets,
  # and apply with: kubectl apply -f k8s/secret.local.yaml
  APP_SECRET: "CHANGE_ME_RANDOM_HEX_SECRET"
  DATABASE_URL: "postgresql://app:CHANGE_ME_DB_PASSWORD@postgres-postgresql.postgres.svc.cluster.local:5432/listing_finder?serverVersion=16&charset=utf8"
  CADDY_MERCURE_JWT_SECRET: "CHANGE_ME_RANDOM_MERCURE_JWT_SECRET"
  MERCURE_JWT_SECRET: "CHANGE_ME_RANDOM_MERCURE_JWT_SECRET"
  MERCURE_PUBLISHER_JWT_KEY: "CHANGE_ME_RANDOM_MERCURE_JWT_SECRET"
  MERCURE_SUBSCRIBER_JWT_KEY: "CHANGE_ME_RANDOM_MERCURE_JWT_SECRET"
  AI_API_KEY: ""
