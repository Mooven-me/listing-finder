apiVersion: apps/v1
kind: Deployment
metadata:
  name: listing-finder-web
  namespace: listing-finder
  labels:
    app.kubernetes.io/name: listing-finder
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: listing-finder
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: listing-finder
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: php
          image: listing-finder:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: listing-finder-config
            - secretRef:
                name: listing-finder-secret
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /metrics
              port: 2019
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
