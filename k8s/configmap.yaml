apiVersion: v1
kind: ConfigMap
metadata:
  name: listing-finder-config
  namespace: listing-finder
data:
  APP_ENV: "prod"
  SERVER_NAME: ":80"
  CADDY_GLOBAL_OPTIONS: "auto_https off"
  DEFAULT_URI: "http://listing-finder.home.arpa"
  MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
  LOCK_DSN: "flock"
  # AI Backend Configuration:
  # - For Local AI (Ollama GPU node): set AI_PROVIDER="ollama", AI_BASE_URL="http://<ollama-host>:11434",
  #   AI_MODEL="lfm2.5:8b" (or "gemma3:12b" / "qwen2.5:14b"), AI_VISION_ENABLED="auto", AI_MIN_REQUEST_INTERVAL_MS="0"
  # - For OpenAI-compatible API (e.g. vLLM or Groq): set AI_PROVIDER="openai" (API key in listing-finder-secret -> AI_API_KEY)
  AI_PROVIDER: "openai"
  AI_BASE_URL: "https://api.groq.com/openai/v1"
  AI_MODEL: "openai/gpt-oss-120b"
  AI_VISION_MODEL: "openai/gpt-oss-120b"
  AI_VISION_ENABLED: "false"
  AI_TIMEOUT: "60"
  AI_NUM_CTX: "8192"
  # Pace LLM requests safely under cloud rate limits (set to "0" for local Ollama / vLLM GPU inference)
  AI_MIN_REQUEST_INTERVAL_MS: "9000"
  SEARXNG_BASE_URL: "http://searxng:8080"
  SEARXNG_TIMEOUT: "8"
  LISTING_PROVIDERS_ENABLED: "leboncoin,vinted,backmarket"
  LISTING_PROVIDER_FALLBACK_TO_MOCK: "false"
  LISTING_PROVIDER_MAX_UNLIMITED_PAGES: "5"
  MERCURE_URL: "http://listing-finder-web/.well-known/mercure"
  MERCURE_PUBLIC_URL: "https://listing-finder.home.arpa/.well-known/mercure"
  MERCURE_JWT_ISSUER: "https://listing-finder.home.arpa"
  MERCURE_TRUSTED_ISSUERS: "https://listing-finder.home.arpa"
